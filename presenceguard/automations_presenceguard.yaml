# PresenceGuard – Automationen
#
# Einbinden in configuration.yaml (eigener Namensraum, kollidiert nicht mit
# der HA-UI-Automation-Datei automations.yaml):
#   automation presenceguard: !include presenceguard/automations_presenceguard.yaml
#
# Zeitlogik:
#   * Mo-Fr 17:00  -> Offline setzen
#   * Mo-Fr 09:00  -> zuruecksetzen (gilt auch fuer Montagmorgen nach dem WE)
#   * Sa   00:00   -> Offline setzen
#   * Sonntag      -> KEINE Automation noetig: setUserPreferredPresence ohne
#                     expirationDuration haelt "Offline" als bevorzugten Status
#                     standardmaessig 7 Tage, ueberdauert also das Wochenende
#                     bis zum Reset am Montag 09:00.
#
# Jede Praesenz-Automation frischt zuerst den Token auf, erzwingt ein Update
# des Token-Sensors und ruft dann den passenden REST Command auf.

- id: presenceguard_set_offline_weekday
  alias: "PresenceGuard: Offline (Mo-Fr 17:00)"
  mode: single
  trigger:
    - platform: time
      at: "17:00:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  action:
    - service: shell_command.refresh_presence_token
    - delay: "00:00:03"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.presence_token
    - delay: "00:00:02"
    # Offline setzen und HTTP-Status auswerten (Erfolg = 200/204).
    # continue_on_error: auch bei Timeout/Verbindungsfehler weiter zur Pruefung.
    - service: rest_command.set_teams_offline
      continue_on_error: true
      response_variable: set_result
    - if:
        - condition: template
          value_template: >
            {{ set_result is not defined
               or (set_result.status | default(0)) not in [200, 204] }}
      then:
        - service: persistent_notification.create
          data:
            notification_id: presenceguard_set_failed
            title: "PresenceGuard: Status setzen fehlgeschlagen"
            message: >
              Der bevorzugte Teams-Status konnte nicht gesetzt werden
              (HTTP {{ set_result.status | default('-') if set_result is defined
              else '-' }}). Der Token muss evtl. erneuert werden.
      else:
        # Erfolg -> evtl. vorhandene Fehlermeldung wieder entfernen.
        - service: persistent_notification.dismiss
          data:
            notification_id: presenceguard_set_failed

- id: presenceguard_clear_weekday
  alias: "PresenceGuard: Status zuruecksetzen (Mo-Fr 09:00)"
  mode: single
  trigger:
    - platform: time
      at: "09:00:00"
  condition:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
  action:
    - service: shell_command.refresh_presence_token
    - delay: "00:00:03"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.presence_token
    - delay: "00:00:02"
    # Zuruecksetzen aufrufen und HTTP-Status auswerten (Erfolg = 200/204).
    # continue_on_error: auch bei Timeout/Verbindungsfehler weiter zur Pruefung.
    - service: rest_command.clear_teams_presence
      continue_on_error: true
      response_variable: clear_result
    - if:
        - condition: template
          value_template: >
            {{ clear_result is not defined
               or (clear_result.status | default(0)) not in [200, 204] }}
      then:
        - service: persistent_notification.create
          data:
            notification_id: presenceguard_clear_failed
            title: "PresenceGuard: Zuruecksetzen fehlgeschlagen"
            message: >
              Der bevorzugte Teams-Status konnte nicht zurueckgesetzt werden
              (HTTP {{ clear_result.status | default('-') if clear_result is defined
              else '-' }}). Der Token muss evtl. erneuert werden.
      else:
        # Erfolg -> evtl. vorhandene Fehlermeldung wieder entfernen.
        - service: persistent_notification.dismiss
          data:
            notification_id: presenceguard_clear_failed

