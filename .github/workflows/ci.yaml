name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Ruff lint of the custom integration (the lint gate referenced in CLAUDE.md).
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned so the lint result stays reproducible; bump deliberately.
        run: pip install ruff==0.16.0
      - name: Lint
        run: ruff check --output-format=github custom_components/presenceguard

  # YAML syntax of the Home Assistant content under presenceguard/ (the
  # integration blueprint).
  validate:
    name: Validate Home Assistant YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML syntax
        run: |
          python3 - <<'EOF'
          import glob
          import sys

          import yaml


          class Loader(yaml.SafeLoader):
              pass

          # Home-Assistant-Custom-Tags (!input, !include, !secret, ...) sind kein
          # Standard-YAML. Für die reine Syntaxprüfung als Pass-through behandeln.
          def _passthrough(loader, tag_suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  return loader.construct_scalar(node)
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              return None

          Loader.add_multi_constructor('!', _passthrough)

          files = sorted(glob.glob('presenceguard/**/*.yaml', recursive=True))
          if not files:
              print('Keine YAML-Dateien gefunden', file=sys.stderr)
              sys.exit(1)

          failed = False
          for path in files:
              try:
                  with open(path) as fh:
                      yaml.load(fh, Loader=Loader)
                  print(f'OK   {path}')
              except yaml.YAMLError as exc:
                  failed = True
                  print(f'FAIL {path}: {exc}', file=sys.stderr)

          sys.exit(1 if failed else 0)
          EOF

  # HA manifest/structure validation of the custom integration.
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # HACS compatibility of the custom integration.
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Custom-Integration ist (noch) nicht im offiziellen brands-Repo.
          ignore: brands

  import-check:
    name: Python import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant
        run: pip install homeassistant
      - name: Import all integration modules
        # hassfest/HACS validate only metadata and structure; they never import
        # the Python code, so a wrong import path (e.g. a non-existent module)
        # slips through and only fails at runtime when HA loads the integration.
        # This step actually imports every module to catch that early.
        run: |
          python - <<'EOF'
          import importlib
          import pathlib
          import sys

          sys.path.insert(0, ".")
          root = pathlib.Path("custom_components/presenceguard")
          failed = False
          for path in sorted(root.glob("*.py")):
              module = f"custom_components.presenceguard.{path.stem}"
              try:
                  importlib.import_module(module)
                  print(f"OK   {module}")
              except Exception as exc:  # noqa: BLE001
                  failed = True
                  print(f"FAIL {module}: {exc!r}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          EOF
